<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Murua - Gestionar Turnos</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/styloGestionDeTurnos.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="layout">

        <!-- =========================
             BARRA LATERAL
        ========================== -->
        <aside class="sidebar">

            <!-- LOGO -->
            <div class="brand">
                <img src="../templates/imagenes/LOGO PRINCIPAL (SOLO AUTO).jpeg" alt="Logo Taller Murua" class="logo-img">
                <h2>TALLER MURUA</h2>
                <p>SISTEMA DE GESTIÓN DE EMPLEADOS</p>
            </div>

            <!-- MENÚ -->
            <nav class="menu">
                <a href="#" class="menu-item" onclick="location.href='paneladmin.html'">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>

                <a href="#" class="menu-item" onclick="location.href='presentismo.html'">
                    <i class="fa-solid fa-clock"></i>
                    <span>Ver Presentismo</span>
                </a>

                <a href="#" class="menu-item active">
                    <i class="fa-solid fa-rotate"></i>
                    <span>Gestionar Turnos</span>
                </a>

                <a href="#" class="menu-item" onclick="location.href='ausencias.html'">
                    <i class="fa-solid fa-user-xmark"></i>
                    <span>Registrar Ausencias</span>
                </a>

                <a href="#" class="menu-item" onclick="location.href='modificarasistencia.html'">
                    <i class="fa-solid fa-pen"></i>
                    <span>Modificar Asistencia</span>
                </a>
            </nav>

            <!-- CERRAR SESIÓN -->
            <div class="logout">
                <a href="#" class="menu-item" onclick="location.href='index.html'">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Cerrar sesión</span>
                </a>
            </div>
        </aside>

        <!-- =========================
             CONTENIDO PRINCIPAL
        ========================== -->
        <main class="main-content">

            <!-- ENCABEZADO -->
            <header class="header">
                <div class="header-title">
                    <div class="title-icon">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                    <div>
                        <h1>Gestionar Turnos</h1>
                        <p>Asignación y administración de turnos rotativos</p>
                    </div>
                </div>
            </header>

            <!-- =========================
                 PANEL ASIGNAR TURNO
            ========================== -->
            <form id="form-asignar-turno" class="assignment">

                <div class="assignment-title">
                    <div class="assignment-icon">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <div>
                        <h2>Asignar Turno</h2>
                        <p>Selecciona un empleado y asigna su turno.</p>
                    </div>
                </div>

                <!-- EMPLEADO (Cargado dinámicamente o por select con ID) -->
                <label for="select-empleado">Empleado</label>
                <select id="select-empleado" required>
                    <option value="">Selecciona un empleado...</option>
                </select>

                <!-- TURNO (Asociado al turno_id de la BD) -->
                <label for="select-turno-id">Turno</label>
                <select id="select-turno-id" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;">
                    <option value="">Selecciona un turno...</option>
                    <option value="1">Mañana</option>
                    <option value="2">Tarde</option>
                </select>

                <!-- FECHAS DE VIGENCIA -->
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label for="input-fecha-desde" style="font-size: 12px;">Fecha Desde</label>
                        <input type="date" id="input-fecha-desde" required style="width: 100%; padding: 8px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;">
                    </div>
                    <div style="flex: 1;">
                        <label for="input-fecha-hasta" style="font-size: 12px;">Fecha Hasta</label>
                        <input type="date" id="input-fecha-hasta" required style="width: 100%; padding: 8px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;">
                    </div>
                </div>

                <!-- BOTÓN -->
                <button type="submit" class="assign-button">
                    <i class="fa-solid fa-users"></i>
                    Asignar turno
                </button>
            </form>

        </main>
    </div>

    <!-- SCRIPT JS -->
    <script src="../static/js/GestionDeTurnos.js"></script>
</body>
</html>
