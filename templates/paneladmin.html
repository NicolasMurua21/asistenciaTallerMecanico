<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Taller Murua</title>
</head>
<body>

  <!-- Barra Lateral / Menú -->
  <aside>
    <div>
      <!-- Logo principal PNG -->
      <img src="imagenes/logo.png" alt="Logo Taller Murua">
      <p>SISTEMA DE GESTIÓN DE EMPLEADOS</p>
      
      <!-- Menú de navegación -->
      <nav>
        <button type="button">
          <!-- Icono Casa / Administración -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          Administración
        </button>
      </nav>
    </div>

    <!-- Botón de Salida -->
    <button type="button">
      <!-- Icono Cerrar Sesión -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
      </svg>
      Cerrar sesión
    </button>
  </aside>

  <!-- Contenido Principal -->
  <main>
    <header>
      <h1>¡Bienvenido, Administrador!</h1>
      <p>Bienvenido al panel de administración de empleados.</p>
    </header>

    <section>
      <h2>Funciones de Administración</h2>

      <!-- Grilla / Lista de los 6 Botones de Funciones -->
      <div>
        <!-- 1. Ver presentismo -->
        <button type="button">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 13c-3.04 0-5.5-2.46-5.5-5.5S8.96 6.5 12 6.5s5.5 2.46 5.5 5.5-2.46 5.5-5.5 5.5zm0-9a3.5 3.5 0 100 7 3.5 3.5 0 000-7z"/>
            <path d="M12 9v3.5l2.5 1.5"/>
          </svg>
          <span>Ver presentismo</span>
        </button>

        <!-- 2. Gestionar turnos -->
        <button type="button">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/>
            <path d="M18.5 15.5a2 2 0 100 4 2 2 0 000-4z"/>
          </svg>
          <span>Gestionar turnos</span>
        </button>

        <!-- 3. Registrar ausencias -->
        <button type="button">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 10h-3v3h-2v-3H6v-2h3V8h2v3h3v2z"/>
          </svg>
          <span>Registrar ausencias</span>
        </button>

        <!-- 4. Modificar asistencia -->
        <button type="button">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 000-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
          </svg>
          <span>Modificar asistencia</span>
        </button>

        <!-- 5. Exportar al Excel -->
        <button type="button">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 14h-3v-4h-2v4H8l4 4 4-4zm-3-7V3.5L18.5 9H13z"/>
          </svg>
          <span>Exportar al Excel</span>
        </button>

        <!-- 6. Añadir -->
        <button type="button">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span>AÑADIR</span>
        </button>
      </div>
    </section>

    <!-- Pie del panel / Nota informativa -->
    <footer>
      <p><strong>i</strong> Recordá que todas las modificaciones de asistencia se auditan automáticamente.</p>
    </footer>
  </main>

</body>
</html>
